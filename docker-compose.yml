services:
  postgres:
    image: postgres:16-alpine
    container_name: aura-barkod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura_secret
      POSTGRES_DB: aura_barkod
    ports:
      - "5435:5432"
    volumes:
      - aura_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aura-barkod-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  aura_pg_data:
